[package]
name = "yuque-asset-desk"
version = "0.8.0"
edition = "2024"
description = "Lightweight cross-platform Yuque asset uploader powered by GPUI Kit"
license = "MIT"

[features]
qa = ["dep:qa-gpui", "dep:qa-platform"]

[dependencies]
gpui-kit = "=0.9.0"
qa-gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"], optional = true }
qa-platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["test-support"], optional = true }
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls", "json"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
hex = "0.4"
directories = "6"
arboard = { version = "3", default-features = false }
mime_guess = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
url = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
global-hotkey = "=0.10.0"

[build-dependencies]
embed-resource = "=3.0.12"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
