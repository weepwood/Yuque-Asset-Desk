[package]
name = "yuque-asset-desk"
version = "0.2.0"
edition = "2024"
description = "Lightweight cross-platform Yuque asset uploader"
license = "MIT"
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "system-tray", "compat-1-18"] }
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls", "json"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
directories = "6"
rfd = "0.15"
arboard = { version = "3", default-features = false }
mime_guess = "2"
url = "2"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
