[package]
name = "yuque-asset-desk"
version = "0.3.0"
edition = "2024"
description = "Native cross-platform Yuque upload and asset manager powered by GPUI Kit"
license = "MIT"

[dependencies]
gpui-kit = "=0.9.0"
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls", "json"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
directories = "6"
rfd = "0.15"
arboard = { version = "3", default-features = false }
mime_guess = "2"
url = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
