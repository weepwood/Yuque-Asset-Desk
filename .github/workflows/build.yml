name: Cross-platform Rust desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ui/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/build.yml'
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --target ${{ matrix.target }}
      - name: Release build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Bundle macOS app (unsigned)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="dist/Yuque Asset Desk.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/yuque-asset-desk" "$APP/Contents/MacOS/yuque-asset-desk"
          cp assets/tray.png "$APP/Contents/Resources/tray.png"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>com.weepwood.yuque-asset-desk</string>
            <key>CFBundleExecutable</key><string>yuque-asset-desk</string>
            <key>CFBundleName</key><string>Yuque Asset Desk</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.2.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          cd dist && zip -qr "yuque-asset-desk-${{ matrix.target }}.zip" "Yuque Asset Desk.app"
      - name: Bundle Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/yuque-asset-desk.exe" dist/
          Compress-Archive -Path dist/yuque-asset-desk.exe -DestinationPath "dist/yuque-asset-desk-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: yuque-asset-desk-${{ matrix.target }}
          path: dist/yuque-asset-desk-${{ matrix.target }}.zip
