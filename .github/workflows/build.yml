name: GPUI Kit desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build.yml'
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup target add ${{ matrix.target }}
      - name: Windows native prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --version
      - uses: Swatinem/rust-cache@v2
      - name: Compile and run unit tests
        run: cargo test --target ${{ matrix.target }}
      - name: Release build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package macOS app (unsigned)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="dist/Yuque Asset Desk.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/yuque-asset-desk" "$APP/Contents/MacOS/yuque-asset-desk"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>com.weepwood.yuque-asset-desk</string>
            <key>CFBundleExecutable</key><string>yuque-asset-desk</string>
            <key>CFBundleName</key><string>Yuque Asset Desk</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.3.0</string>
            <key>LSMinimumSystemVersion</key><string>15.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          cd dist && zip -qr "yuque-asset-desk-${{ matrix.target }}.zip" "Yuque Asset Desk.app"
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/yuque-asset-desk.exe" dist/
          Compress-Archive -Path dist/yuque-asset-desk.exe -DestinationPath "dist/yuque-asset-desk-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-kit-${{ matrix.target }}
          path: dist/yuque-asset-desk-${{ matrix.target }}.zip
