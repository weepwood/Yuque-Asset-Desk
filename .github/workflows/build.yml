name: GPUI Kit desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - 'CHANGELOG.md'
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Static checks
        run: python scripts/static_check.py
      - name: Windows native prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --version
      - uses: Swatinem/rust-cache@v2
      - name: Compile and run unit tests
        run: cargo test --locked --target ${{ matrix.target }}
      - name: GPUI interaction regression (macOS arm64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --locked --features qa --target ${{ matrix.target }}
      - name: Release build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and verify release ZIP
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/yuque-asset-desk"
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN="$BIN.exe"; fi
          python scripts/package_release.py --target "${{ matrix.target }}" --binary "$BIN"
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-kit-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
